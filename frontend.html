from fastapi import FastAPI, HTTPException
from pydantic import BaseModel
from typing import Optional, List, Dict
from datetime import datetime
import yt_dlp
import trafilatura
import requests
from bs4 import BeautifulSoup
from urllib.parse import urlparse
from notion_client import Client
from dotenv import load_dotenv

load_dotenv()
app = FastAPI(title="Muse Notion Collector V2", version="2.0.0")

NOTION_TOKEN = os.getenv("NOTION_TOKEN")
NOTION_DATABASE_ID = os.getenv("NOTION_DATABASE_ID")
APIFY_TOKEN = os.getenv("APIFY_TOKEN")

class LinkPayload(BaseModel):
    url: str
    force_apify: bool = False

def detect_platform(url: str) -> str:
    l = url.lower()
    if "instagram" in l or "ig." in l or "insta" in l:
        return "IG"
    if "threads" in l:
        return "Threads"
    if "x.com" in l or "twitter.com" in l or "t.co" in l:
        return "X"
    return "Web"

# ---------- Social: Apify first ----------
def extract_with_apify(url: str, platform: str) -> Optional[Dict]:
    if not APIFY_TOKEN:
        return None
    try:
        from apify_client import ApifyClient
        client = ApifyClient(APIFY_TOKEN)
        # 依平台選擇對應的 Actor，範例為社群常用 Actor 名稱，請依實際帳號替換
        actor_map = {
            "IG": "apify/instagram-scraper",
            "Threads": "apify/threads-scraper",
            "X": "apify/twitter-scraper",
        }
        actor_id = actor_map.get(platform)
        if not actor_id:
            return None

        run_input = {
            "directUrls": [url],
            "resultsType": "posts",
            "resultsLimit": 1,
        }
        # 範例：同步呼叫 Actor 並等待完成
        run = client.actor(actor_id).call(run_input=run_input)
        dataset_id = run.get("defaultDatasetId")
        items = list(client.dataset(dataset_id).iterate_items())
        if not items:
            return None
        item = items[0]
        return {
            "author": item.get("ownerUsername") or item.get("username") or item.get("author") or "unknown",
            "handle": "@" + (item.get("ownerUsername") or item.get("username") or ""),
            "caption": item.get("caption") or item.get("text") or "",
            "thumbnails": item.get("displayUrls") or [item.get("displayUrl")] if item.get("displayUrl") else [],
            "timestamp": item.get("timestamp"),
            "source": "apify",
        }
    except Exception as e:
        print(f"[Apify fallback] {platform} {url} failed: {e}")
        return None

def extract_with_ytdlp(url: str) -> Dict:
    ydl_opts = {
        "quiet": True,
        "skip_download": True,
        "noplaylist": True,
        "extractor_args": {"generic": ["impersonate"]},
    }
    with yt_dlp.YoutubeDL(ydl_opts) as ydl:
        info = ydl.extract_info(url, download=False)
        thumbs = []
        for t in (info.get("thumbnails") or [])[-4:]:
            if t.get("url"):
                thumbs.append(t["url"])
        return {
            "author": info.get("uploader") or info.get("channel") or info.get("creator") or "unknown",
            "handle": info.get("uploader_id") and f"@{info.get('uploader_id')}" or "@guest",
            "caption": info.get("description") or info.get("title") or "",
            "thumbnails": thumbs,
            "timestamp": info.get("timestamp"),
            "source": "yt-dlp",
        }

# ---------- Web: trafilatura + bs4 ----------
def extract_web_page(url: str) -> Dict:
    try:
        # 1. trafilatura 抓主文
        downloaded = trafilatura.fetch_url(url)
        main_text = trafilatura.extract(downloaded, include_comments=False, include_tables=False) if downloaded else ""

        # 2. BeautifulSoup 抓 meta
        resp = requests.get(url, timeout=12, headers={"User-Agent": "Mozilla/5.0 MuseCollector/2.0"})
        resp.raise_for_status()
        soup = BeautifulSoup(resp.text, "html.parser")

        title = ""
        if soup.title and soup.title.string:
            title = soup.title.string.strip()
        og_title = soup.find("meta", property="og:title")
        if og_title and og_title.get("content"):
            title = og_title["content"]

        desc = ""
        og_desc = soup.find("meta", property="og:description") or soup.find("meta", attrs={"name": "description"})
        if og_desc and og_desc.get("content"):
            desc = og_desc["content"]

        og_image = ""
        og_img_tag = soup.find("meta", property="og:image")
        if og_img_tag and og_img_tag.get("content"):
            og_image = og_img_tag["content"]

        domain = urlparse(url).hostname or ""

        # 圖片列表（前 6 張）
        imgs: List[str] = []
        for img in soup.find_all("img")[:12]:
            src = img.get("src") or img.get("data-src")
            if src and src.startswith("http"):
                imgs.append(src)
            if len(imgs) >= 6:
                break
        if og_image and og_image not in imgs:
            imgs = [og_image] + imgs

        return {
            "title": title[:200],
            "description": desc[:500],
            "og_image": og_image,
            "domain": domain,
            "main_text": (main_text or "")[:8000],
            "text_preview": (main_text or desc or "")[:200],
            "images": imgs[:6],
        }
    except Exception as e:
        raise HTTPException(status_code=422, detail=f"Web extract failed: {e}")

def write_to_notion(payload: Dict):
    if not NOTION_TOKEN or not NOTION_DATABASE_ID:
        return {"mock": True, "reason": "No Notion creds, skip write"}
    notion = Client(auth=NOTION_TOKEN)
    props = {
        "URL": {"title": [{"text": {"content": payload["url"]}}]},
        "Platform": {"select": {"name": payload["platform"]}},
        "Author": {"rich_text": [{"text": {"content": (payload.get("author") or payload.get("title") or "")[:2000]}}]},
        "Handle": {"rich_text": [{"text": {"content": (payload.get("handle") or payload.get("domain") or "")[:500]}}]},
        "Caption": {"rich_text": [{"text": {"content": (payload.get("caption") or payload.get("description") or "")[:2000]}}]},
        "PostDate": {"date": {"start": datetime.now().isoformat()}},
        "Domain": {"rich_text": [{"text": {"content": payload.get("domain", "")}}]},
        "FullContent": {"rich_text": [{"text": {"content": (payload.get("main_text") or payload.get("caption") or "")[:2000]}}]},
    }
    # Notion Files 需為外部可訪問 URL，內部註記
    # 若要上傳，需先用 Notion File Upload API 取得 file reference
    # 此處先用 external 方式，若 og_image 存在
    if payload.get("og_image") or payload.get("thumbnails"):
        files = []
        for u in (payload.get("thumbnails") or [])[:3] + ([payload.get("og_image")] if payload.get("og_image") else []):
            if u:
                files.append({"name": u.split("/")[-1][:80], "type": "external", "external": {"url": u}})
        if files:
            props["Images"] = {"files": files[:6]}

    return notion.pages.create(parent={"database_id": NOTION_DATABASE_ID}, properties=props)

@app.post("/api/collect")
def collect_social(payload: LinkPayload):
    platform = detect_platform(payload.url)
    if platform == "Web":
        raise HTTPException(status_code=400, detail="Use /api/collect-web for general web pages")
    try:
        data = None
        if APIFY_TOKEN:
            data = extract_with_apify(payload.url, platform)
        if not data:
            data = extract_with_ytdlp(payload.url)
        result = {
            "url": payload.url,
            "platform": platform,
            "author": data.get("author"),
            "handle": data.get("handle"),
            "caption": data.get("caption"),
            "thumbnails": data.get("thumbnails", []),
            "source": data.get("source"),
        }
        notion_res = write_to_notion(result)
        return {"ok": True, **result, "notion": str(notion_res)[:500]}
    except HTTPException:
        raise
    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))

@app.post("/api/collect-web")
def collect_web(payload: LinkPayload):
    try:
        web = extract_web_page(payload.url)
        result = {
            "url": payload.url,
            "platform": "Web",
            "title": web["title"],
            "description": web["description"],
            "og_image": web["og_image"],
            "domain": web["domain"],
            "main_text": web["main_text"],
            "text_preview": web["text_preview"],
            "images": web["images"],
            # 兼容 Notion 欄位
            "author": web["title"],
            "handle": web["domain"],
            "caption": web["description"] or web["text_preview"],
            "thumbnails": web["images"],
        }
        notion_res = write_to_notion(result)
        return {"ok": True, **result, "notion": str(notion_res)[:500]}
    except HTTPException:
        raise
    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))

@app.get("/health")
def health():
    return {"status": "ok", "version": "2.0.0", "apify_enabled": bool(APIFY_TOKEN)}

COPY . .

EXPOSE 8000
CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

<!-- Muse Collector V3.1 real API bridge: the bundled UI above is a mock (no fetch calls);
     this panel wires the page to the live backend. -->
<div id="collector-bridge" style="position:fixed;right:16px;bottom:16px;z-index:9999;width:min(420px,calc(100vw - 32px));background:#141416;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px;font-family:system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.5)">
  <div style="font-weight:600;font-size:13px;margin-bottom:8px">即時截錄（連接後端 API）</div>
  <input id="cb-url" placeholder="貼上 IG / Threads / X / 一般網頁連結" style="width:100%;box-sizing:border-box;background:#000;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 10px;font-size:12px">
  <div style="display:flex;gap:8px;margin-top:8px">
    <select id="cb-dest" style="flex:1;background:#000;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px;font-size:12px">
      <option value="both" selected>兩個都存（both）</option>
      <option value="notion">只存 Notion</option>
      <option value="obsidian">只存 Obsidian</option>
    </select>
    <button id="cb-go" style="background:#fff;color:#000;border:0;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer">開始截錄</button>
  </div>
  <pre id="cb-out" style="white-space:pre-wrap;word-break:break-word;font-size:11px;color:rgba(255,255,255,.75);max-height:180px;overflow:auto;margin:10px 0 0"></pre>
</div>
<script>
document.getElementById('cb-go').addEventListener('click', async () => {
  const url = document.getElementById('cb-url').value.trim();
  const destination = document.getElementById('cb-dest').value;
  const out = document.getElementById('cb-out');
  if (!url) { out.textContent = '請先貼上連結'; return; }
  const isSocial = /instagram\.com|threads\.(com|net)|x\.com|twitter\.com/.test(url);
  const endpoint = isSocial ? '/api/collect' : '/api/collect-web';
  out.textContent = '截錄中… ' + endpoint;
  try {
    const r = await fetch(endpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url, destination})});
    out.textContent = JSON.stringify(await r.json(), null, 2);
  } catch (e) { out.textContent = '呼叫失敗：' + e; }
});
</script>
